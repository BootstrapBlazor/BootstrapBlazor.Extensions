name: Auto PR test(bot)

on:
  pull_request:
    branches:
      - master
      - main
      - dev

jobs:
  run_test:
    name: run test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: |
          dotnet test test/UnitTestEditor
